# .github/workflows/build-dylib.yml
name: build-cheat-dylib

on:
  push:
    paths:
      - 'project/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Compile cheat.dylib
        run: |
          cd project
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
            -framework UIKit \
            -framework Foundation \
            -lm \
            -O2 \
            -Wall \
            -Wno-unused-parameter \
            -mios-version-min=16.0 \
            -o cheat.dylib cheat.c
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
            -framework Foundation \
            -O2 \
            -Wall \
            -Wno-unused-parameter \
            -mios-version-min=16.0 \
            -o meta_extract.dylib meta_extract.c
          echo "[+] Compile done"

      - name: Compile meta_extract_v5
        run: |
          cd project
          xcrun -sdk iphoneos clang \
            -arch arm64 -dynamiclib \
            -framework Foundation \
            -lm -O1 \
            -o meta_extract_v5.dylib meta_extract_v5.c
          echo "[+] v5 compile done"
          file meta_extract_v5.dylib
          otool -L meta_extract_v5.dylib
          ls -lh meta_extract_v5.dylib
      - name: Verify binary
        run: |
          cd project
          file cheat.dylib meta_extract.dylib
          otool -L cheat.dylib
          otool -L meta_extract.dylib
          otool -h cheat.dylib
          ls -lh cheat.dylib meta_extract.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cheat-dylib-arm64
          path: project/cheat.dylib
          retention-days: 7

      - name: Upload extractor artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-extract-dylib-arm64
          path: project/meta_extract.dylib
          retention-days: 7

      - name: Upload meta_extract_v5
        uses: actions/upload-artifact@v4
        with:
          name: meta-extract-v5-dylib-arm64
          path: project/meta_extract_v5.dylib
          retention-days: 7
